[project]
name = "law-agent"
version = "0.1.0"
description = "法律知识库与法律问答 Agent 后端服务"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "aiosqlite>=0.20,<1.0",
    "chromadb>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
