[project]
name = "law-agent"
version = "0.1.0"
description = "法律知识库与法律问答 Agent 后端服务"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5,<7",
    "langgraph>=0.2,<2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "pymilvus>=3.0.1",
    "sentence-transformers>=6.0.1",
    "huggingface-hub>=0.20.0,<2.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "accelerate>=1.15.0",
    "langfuse>=4.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fpdf2>=2.8,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
