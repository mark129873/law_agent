<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport 声明：让页面在手机等小屏设备上按设备宽度正确缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>法律知识库助手</title>
  </head>
  <body>
    <!-- React 应用的挂载点：src/main.tsx 会把整棵组件树渲染进这个 div -->
    <div id="root"></div>
    <!-- type="module"：以 ES 模块方式加载入口脚本，Vite 依赖这一点做按需编译 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
